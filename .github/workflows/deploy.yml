name: CI/CD Pipeline — Test & Deploy

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Lint & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio pytest-cov

      - name: Code Quality & Lint Checks
        run: |
          ruff check src tests scripts

      - name: Run Unit & Integration Tests
        env:
          APP_ENV: test
          LLM_PROVIDER: mock
          SQLITE_PATH: data/processed/restaurants.db
        run: |
          PYTHONPATH=src pytest tests/unit -v --cov=src/app

  deploy-railway:
    name: Trigger Railway Deployment
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy Services to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -n "$RAILWAY_TOKEN" ]; then
            echo "Deploying to Railway..."
            railway up --service nextleap-backend --detach || true
            railway up --service nextleap-frontend --detach || true
          else
            echo "RAILWAY_TOKEN not configured in GitHub Secrets. Skipping automated deploy."
          fi
